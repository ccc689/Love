<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给你的专属惊喜</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffd1ff 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            overflow: hidden; /* 防止手机端出现滚动条 */
            position: relative;
        }

        /* 背景漂浮的小星星/爱心装饰 */
        .floating-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            animation: floatUp 10s linear infinite;
            bottom: -50px;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* 玻璃拟态卡片 */
        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 30px 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: cardIn 1s ease-out;
        }
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 照片画框 */
        .img-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
            animation: pulse 3s infinite alternate;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }
        @keyframes pulse {
            0% { box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4); }
            100% { box-shadow: 0 15px 30px rgba(255, 154, 158, 0.8); }
        }

        /* 文字 */
        h1 {
            font-size: 20px;
            color: #ff6b81;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .message {
            font-size: 15px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* 自定义播放按钮 */
        .play-btn {
            background: linear-gradient(135deg, #ff6b81, #ff9a9e);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
        }
        .play-btn.playing {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            box-shadow: 0 8px 20px rgba(161, 140, 209, 0.5);
        }

        /* 隐藏原始播放器 */
        #bg-music { display: none; }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">✨</div>
    <div class="floating-heart" style="left: 30%; animation-delay: 2s;">❤️</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 4s;">✨</div>
    <div class="floating-heart" style="left: 90%; animation-delay: 6s;">❤️</div>
    <div class="floating-heart" style="left: 50%; animation-delay: 8s;">✨</div>

    <!-- 主卡片 -->
    <div class="card">
        <div class="img-container">
            <!-- 如果没有照片，这块会自动隐藏 -->
            <img src="photo.jpg" alt="我们的照片" onerror="this.parentElement.style.display='none'">
        </div>
        
        <h1>碰一碰，听到我</h1>
        <p class="message">
            小璎，我给你准备的一首歌。<br>
            希望这首歌，能陪你度过每一个我不在身边的瞬间。
        </p>

        <!-- 播放按钮 -->
        <button id="play-btn" class="play-btn" onclick="togglePlay()">
            <span id="btn-icon">▶</span> 点击播放
        </button>

        <!-- 音频文件 -->
        <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
    </div>

    <script>
        var audio = document.getElementById('bg-music');
        var btn = document.getElementById('play-btn');
        var icon = document.getElementById('btn-icon');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('playing');
                icon.innerText = '❚❚'; // 暂停图标
                btn.innerHTML = '<span id="btn-icon">❚❚</span> 正在播放...';
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.innerHTML = '<span id="btn-icon">▶</span> 点击播放';
            }
        }
    </script>
</body>
</html>
