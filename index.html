<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多远都要在一起</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #fff5f6 0%, #f0f2f5 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 背景漂浮的粉色光斑 */
        .bg-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 129, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: breathe 6s infinite alternate;
        }
        .bg-glow:nth-child(1) { top: -100px; left: -100px; }
        .bg-glow:nth-child(2) { bottom: -100px; right: -100px; background: rgba(161, 140, 209, 0.15); animation-delay: 2s; }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }

        /* ========== 整体主容器 ========== */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            max-width: 900px;
            width: 100%;
            z-index: 1;
        }

        /* ========== 左边：悬挂照片墙 ========== */
        .left-gallery {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px 30px;
        }
        /* 有质感的悬挂麻绳 */
        .left-gallery::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px;
            background: repeating-linear-gradient(45deg, #d2b48c, #d2b48c 4px, #c19a6b 4px, #c19a6b 8px);
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transform: translateX(-50%);
            z-index: -1;
        }

        .photo-wrap {
            background: white;
            padding: 8px 8px 24px 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-radius: 2px;
            position: relative;
            transition: all 0.4s ease;
            animation: swing 4s ease-in-out infinite alternate;
        }
        /* 模拟金属夹子 */
        .photo-wrap::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 16px;
            background: linear-gradient(to bottom, #ccc, #888);
            border-radius: 4px 4px 0 0;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 2px 4px rgba(0,0,0,0.2);
        }
        /* 错落的排布 */
        .photo-wrap:nth-child(1) { transform: rotate(-6deg) translateX(-15px); animation-delay: 0s; }
        .photo-wrap:nth-child(2) { transform: rotate(5deg) translateX(15px); animation-delay: 0.5s; }
        .photo-wrap:nth-child(3) { transform: rotate(-3deg) translateX(-5px); animation-delay: 1s; }

        .photo-wrap img {
            width: 85px;
            height: 105px;
            object-fit: cover;
            border-radius: 1px;
        }

        @keyframes swing {
            0% { rotate: -2deg; }
            100% { rotate: 2deg; }
        }

        /* ========== 右边：唱片机与歌词 ========== */
        .right-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        /* 黑胶唱片机（带光晕） */
        .record-player {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 25px;
        }
        .vinyl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3a3a3a 30%, #1a1a1a 70%, #000 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 40px rgba(255,107,129,0.3);
            animation: spin 4s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.5s;
        }
        .vinyl::before {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
        }
        
        .vinyl-label {
            width: 42%;
            height: 42%;
            border-radius: 50%;
            background-image: url('photo.jpg');
            background-size: cover;
            background-position: center;
            z-index: 2;
            border: 3px solid #ff6b81;
            box-shadow: 0 0 15px rgba(255,107,129,0.6);
        }
        
        /* 唱臂 */
        .tonearm {
            position: absolute;
            top: -12px;
            right: 8px;
            width: 65px;
            height: 6px;
            background: linear-gradient(to bottom, #eee, #999);
            border-radius: 5px;
            transform-origin: right center;
            transform: rotate(-35deg);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        .tonearm::after {
            content: '';
            position: absolute;
            left: -8px;
            top: -3px;
            width: 16px;
            height: 12px;
            background: #444;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* 播放状态 */
        .playing .vinyl { 
            animation-play-state: running; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 60px rgba(255,107,129,0.6);
        }
        .playing .tonearm { transform: rotate(5deg); }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 歌词区 */
        .lyrics-container {
            width: 100%;
            height: 110px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            margin-bottom: 30px;
        }
        .lyrics-inner {
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .lyric-line {
            font-size: 14px;
            color: #aaa;
            padding: 10px 0;
            text-align: center;
            transition: all 0.4s ease;
            transform-origin: center;
        }
        .lyric-line.active {
            color: #ff6b81;
            font-weight: bold;
            font-size: 17px;
            transform: scale(1.1);
            text-shadow: 0 0 10px rgba(255,107,129,0.5);
        }

        /* 播放按钮（脉冲光效） */
        .play-btn {
            background: linear-gradient(135deg, #ff6b81, #ff9a9e);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .play-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            transition: transform 0.5s;
        }
        .play-btn:hover::before { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        .play-btn:active { transform: scale(0.95); }
        .play-btn.playing {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            box-shadow: 0 8px 25px rgba(161, 140, 209, 0.5);
        }

        /* 心跳脉冲动画 */
        .play-btn:not(.playing) {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
        }

        #bg-music { display: none; }

        /* ========== 手机屏幕适配 ========== */
        @media (max-width: 650px) {
            .main-container {
                flex-direction: column;
                gap: 20px;
            }
            .left-gallery {
                flex-direction: row;
                padding: 10px 0;
                gap: 15px;
            }
            .left-gallery::before { display: none; }
            .photo-wrap { padding: 5px 5px 15px 5px; animation: none; }
            .photo-wrap:nth-child(1) { transform: rotate(-4deg) translateX(0); }
            .photo-wrap:nth-child(2) { transform: rotate(3deg) translateX(0); }
            .photo-wrap:nth-child(3) { transform: rotate(-2deg) translateX(0); }
            .photo-wrap img { width: 70px; height: 85px; }
            .right-player { padding: 25px 20px; }
            .record-player { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <!-- 背景氛围光斑 -->
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>

    <div class="main-container">
        <!-- 左边：照片墙 -->
        <div class="left-gallery">
            <div class="photo-wrap"><img src="photo.jpg" alt="照片1" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MCIgaGVpZ2h0PSIxMTAiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuaXoOazleWKoOi9vTwvdGV4dD48L3N2Zz4='"></div>
            <div class="photo-wrap"><img src="photo1.jpg" alt="照片2" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MCIgaGVpZ2h0PSIxMTAiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuaXoOazleWKoOi9vTwvdGV4dD48L3N2Zz4='"></div>
            <div class="photo-wrap"><img src="photo2.jpg" alt="照片3" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MCIgaGVpZ2h0PSIxMTAiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuaXoOazleWKoOi9vTwvdGV4dD48L3N2Zz4='"></div>
        </div>

        <!-- 右边：唱片机 + 歌词 + 按钮 -->
        <div class="right-player">
            <div class="record-player" id="player-container">
                <div class="tonearm"></div>
                <div class="vinyl">
                    <div class="vinyl-label"></div>
                </div>
            </div>
            
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyrics-inner" id="lyrics-inner"></div>
            </div>

            <button class="play-btn" id="play-btn" onclick="togglePlay()">
                <span id="btn-icon">▶</span> 点击播放
            </button>
        </div>
    </div>

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <script>
        var audio = document.getElementById('bg-music');
        var btn = document.getElementById('play-btn');
        var container = document.getElementById('player-container');
        var lyricsInner = document.getElementById('lyrics-inner');
        var lyricsContainer = document.getElementById('lyrics-container');

        // 歌词时间轴
        const lyricsData = [
            { time: 0, text: "作曲 : G.E.M.邓紫棋" },
            { time: 1, text: "作词 : G.E.M.邓紫棋" },
            { time: 14.25, text: "想听你听过的音乐 想看你看过的小说" },
            { time: 20.16, text: "我想收集每一刻 我想看到你眼里的世界" },
            { time: 28.44, text: "想到你到过的地方 和你曾度过的时光" },
            { time: 34.17, text: "不想错过每一刻 多希望我一直在你身旁" },
            { time: 42.80, text: "未来何从何去 你快乐我也就没关系" },
            { time: 48.41, text: "对你我最熟悉 你爱自由我却更爱你" },
            { time: 55.56, text: "我能习惯远距离 爱总是身不由己" },
            { time: 62.37, text: "宁愿换个方式至少还能遥远爱着你" },
            { time: 69.50, text: "爱能克服远距离 多远都要在一起" },
            { time: 76.57, text: "你已经不再存在我世界里 请不要离开我的回忆" },
            { time: 88.40, text: "想你说爱我的语气 想你望着我的眼睛" },
            { time: 94.22, text: "不想忘记每一刻 用思念让我们一直前进" },
            { time: 104.85, text: "想象你失落的唇印 想象你失约的旅行" },
            { time: 110.70, text: "想象你离开的一刻 如果我有留下你的勇气" },
            { time: 118.00, text: "我能习惯远距离 爱总是身不由己" },
            { time: 126.06, text: "宁愿换个方式至少还能遥远爱着你" },
            { time: 133.36, text: "爱能克服远距离 多远都要在一起" },
            { time: 140.09, text: "我已经不再存在你的心里 就让我独自守着回忆" },
            { time: 148.70, text: "如果阳光永远都炽热" },
            { time: 152.40, text: "如果彩虹不会掉颜色" },
            { time: 156.00, text: "你能不能不离开呢" },
            { time: 163.30, text: "我能习惯远距离 爱总是身不由己" },
            { time: 170.60, text: "宁愿换个方式至少还能遥远爱着你" },
            { time: 177.80, text: "爱能克服远距离 多远都要在一起" },
            { time: 184.70, text: "你已经不再存在我世界里 请不要离开我的回忆" },
            { time: 198.00, text: "请不要离开 我的回忆" }
        ];

        lyricsData.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = 'lyric-' + index;
            div.innerText = item.text;
            lyricsInner.appendChild(div);
        });

        let currentLyricIndex = -1;

        audio.addEventListener('timeupdate', function() {
            let currentTime = audio.currentTime;
            let newIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    newIndex = i;
                } else {
                    break;
                }
            }

            if (newIndex !== -1 && newIndex !== currentLyricIndex) {
                if (currentLyricIndex !== -1) {
                    let prevLine = document.getElementById('lyric-' + currentLyricIndex);
                    if(prevLine) prevLine.classList.remove('active');
                }
                
                currentLyricIndex = newIndex;
                let currentLine = document.getElementById('lyric-' + currentLyricIndex);
                if(currentLine) {
                    currentLine.classList.add('active');
                    let offset = currentLyricIndex * currentLine.offsetHeight;
                    let containerHeight = lyricsContainer.offsetHeight;
                    let translateY = offset - containerHeight / 2 + currentLine.offsetHeight / 2;
                    lyricsInner.style.transform = `translateY(-${translateY}px)`;
                }
            }
        });

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('playing');
                container.classList.add('playing');
                btn.innerHTML = '<span id="btn-icon">❚❚</span> 正在播放...';
            } else {
                audio.pause();
                btn.classList.remove('playing');
                container.classList.remove('playing');
                btn.innerHTML = '<span id="btn-icon">▶</span> 继续播放';
            }
        }

        audio.addEventListener('ended', function() {
            btn.classList.remove('playing');
            container.classList.remove('playing');
            btn.innerHTML = '<span id="btn-icon">▶</span> 点击播放';
            currentLyricIndex = -1;
            lyricsInner.style.transform = 'translateY(0px)';
            document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
        });
    </script>
</body>
</html>
